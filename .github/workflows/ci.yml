name: CI

on:
  push:
    branches: ["main", "master", "dev"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.9"
            install_tk: true
          - os: ubuntu-latest
            python: "3.12"
            install_tk: true
          - os: macos-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Installa Tk (Linux)
        if: matrix.install_tk
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Dipendenze (Python 3.9, pin del runtime)
        if: matrix.python == '3.9'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi==0.88.0" "starlette==0.22.0" "pydantic==1.10.2" "requests==2.28.1" "watchdog==6.0.0" "pytest==7.4.4" "ruff==0.6.9"

      - name: Dipendenze (Python 3.12)
        if: matrix.python != '3.9'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi==0.88.0" "starlette==0.22.0" "pydantic>=1.10.13,<2" "requests" "watchdog" "pytest==7.4.4" "ruff==0.6.9"

      - name: Lint
        run: python -m ruff check app tests tools

      - name: Test unitari e di integrazione
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest tests/unit tests/integration -q

  catalogs:
    name: Coerenza cataloghi i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Valida IT/EN
        run: python tools/dev.py i18n

  hygiene:
    name: Igiene repository (GitHub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: File obbligatori, cartelle locali, segreti, dimensione
        run: python tools/check_repo.py
