# RVC Portable — configurazione installer (Windows)
#
# Questo file viene letto da setup.bat quando runtime\ non esiste ancora.
# Dopo aver creato la prima release su GitHub, esegui UNA volta:
#
#   runtime\python.exe -B tools\build_runtime_asset.py --repo Nicotina4ever/rvc-portable --update-install-conf
#
# poi carica in una release (tag runtime-v3.0.0) TUTTI gli asset elencati in
# dist/*.manifest.json e committa questo file aggiornato.
#
# Se lo zip supera 2 GiB (limite GitHub per asset) viene diviso in parti .001, .002, ...
# e setup.bat le ricompone automaticamente prima di verificare l'hash.
#
# RUNTIME_WINDOWS_SHA256 vuoto = verifica hash saltata (solo per test in locale).
RUNTIME_WINDOWS_URL=https://github.com/Nicotina4ever/rvc-portable/releases/download/runtime-v3.0.0/RVC-Portable-runtime-windows-py39-cu118.zip
RUNTIME_WINDOWS_SHA256=67df4dd9b9baa69ee011f04459c78a004caca9f6e1c2a7d8f4c1dadc8c2d41fb
RUNTIME_WINDOWS_SIZE_MB=3594
RUNTIME_WINDOWS_PARTS=2
